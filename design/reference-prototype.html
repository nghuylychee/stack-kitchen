  }
  const seatEl = i => document.querySelector(`.seat[data-p="${i}"]`);

  const coursesHTML = p => `<span class="courses">${['A', 'M', 'D'].map(c => `<span class="course ${c} ${hasCourse(p, c) ? 'have' : ''}" title="${COURSE_NAME[c]}">${c}</span>`).join('')}</span>`;
  function headHTML(p) {
    return `<div class="head1"><span class="stool ${p.idx % 2 ? 'b' : 'r'}"></span><span class="plate">${p.name}</span><span class="score" id="score-${p.idx}">${p.score} pts</span></div>
      <div class="head2"><span class="stat"><span class="backicon"></span>×<b>${visHand(p).length}</b></span>${coursesHTML(p)}</div>`;
  }

  function progHTML(start) {
    const el = Date.now() - start;
    return `<div class="prog"><i style="animation-duration:${COOK_MS}ms;animation-delay:-${Math.min(el, COOK_MS)}ms"></i></div><div class="steam"><span></span><span></span><span></span></div>`;
  }

  let renderQueued = false;
  function softRender() { if (renderQueued) return; renderQueued = true; setTimeout(() => { renderQueued = false; render(); }, 16); }
  let foodsKey = '';

  function render() {
    if (!G) return;
    const n = G.players.length;
    const undealt = G.dealing ? HAND_START * n - G.dealt.reduce((a, b) => a + b, 0) : 0;
    const poolShown = G.pool.length + undealt;
    $('cTurn').textContent = G.turn;
    const me = G.players[0];

    // ---- center ----
    const pp = $('pool-pile');
    pp.classList.toggle('glow', G.phase === 'draw');
    pp.classList.toggle('dashed', poolShown === 0);
    pp.innerHTML = poolShown === 0 ? '<span class="lbl">Pool empty</span>'
      : [2, 1, 0].filter(k => poolShown > k).map(k => backHTML('center', '', `style="left:${k * 2}px;top:${-k * 2}px" ${k === 0 ? 'data-act="pool"' : ''}`)).join('') + `<span class="lbl">Pool ${poolShown}</span>`;
    const ls = $('last-slot');
    let lh = '';
    if (G.lastPlayed && !G.lastHidden && !claimInGroup(me)) {
      const cls = (G.phase === 'claim' ? 'claimable' : '') + (G.lastJust ? ' just shine' : '');
      const hid = drag && drag.src.kind === 'claim' && drag.ghost ? 'incoming' : '';
      lh = ingHTML(G.lastPlayed, 'center', cls + ' ' + hid, G.phase === 'claim' ? 'data-drag="claim"' : '') + `<span class="lbl">by ${G.lastBy}</span>`;
    } else if (!G.lastPlayed) lh = G.phase === 'play' ? '<span class="lbl">Drag here to play</span>' : '<span class="lbl" style="opacity:.6">Last played</span>';
    if (G.phase === 'claim') lh += '<button class="pass" id="btnPass" data-act="pass">Pass</button>';
    ls.innerHTML = lh;
    ls.classList.toggle('play-target', G.phase === 'play' && !G.lastPlayed);
    ls.classList.toggle('dashed', !G.lastPlayed);
    const dsc = $('discard-slot');
    const older = G.discard.slice(-6, -1);
    dsc.innerHTML = G.discard.length ? older.map((t, i) => {
      const age = older.length - i;
      return ingHTML(t, 'disc', '', `style="left:${40 + age * 3}px;top:${-4 + age * 8}px;opacity:${Math.max(.35, 1 - age * .13)};rotate:${age * 4}deg"`);
    }).join('') + ingHTML(G.discard[G.discard.length - 1], 'center', '', 'style="left:0;top:0"') + `<span class="lbl">Discard</span>`
      : '<span class="lbl" style="opacity:.6">Discard</span>';
    dsc.classList.toggle('dashed', !G.discard.length);

    // ---- bots ----
    for (const p of G.players.slice(1)) {
      const s = seatEl(p.idx); if (!s) continue;
      s.classList.toggle('active', G.current === p.idx && !G.ended && !G.dealing);
      s.querySelector('.seat-head').innerHTML = headHTML(p);
      const vh = visHand(p);
      const bk = s.querySelector('.seat-hand-backs');
      const W = bk.clientWidth - 40;
      const faces = G.ended;                                       // flip only at GAME_END
      const off = vh.length > 1 ? Math.min(faces ? 20 : 12, W / (vh.length - 1)) : 0;
      bk.innerHTML = vh.map((c, i) => faces ? ingHTML(c.t, 'mini', '', `style="left:${i * off}px"`) : backHTML('mini', '', `style="left:${i * off}px"`)).join('');
      bk.dataset.next = vh.length * off;
      s.querySelector('.seat-foods').innerHTML = p.foods.map(f => foodThumb(f, 'xs')).join('');
      const be = s.querySelector('.seat-stack');
      const b = p.stk;
      be.classList.toggle('empty', !b.stack.length && !b.food);
      if (b.food) be.innerHTML = `<div class="stack" style="height:67px">${foodHTML(b.food, 'bstk', 'pop-in shine')}</div>`;
      else if (b.stack.length) {
        be.innerHTML = `<div class="stack" style="height:${67 + 12 * (b.stack.length - 1)}px">` + (b.cooking ? progHTML(b.cookStart) : '') +
          b.stack.map((c, i) => ingHTML(c.t, 'bstk', (b.cooking ? 'locked ' : '') + (i >= b.stack.length - b.arriving ? 'incoming' : ''), `style="top:${i * 12}px"`)).join('') + '</div>';
      } else be.innerHTML = '';
    }

    // ---- human panel ----
    $('dock').classList.toggle('active', G.current === 0 && !G.ended && !G.dealing);
    $('my-h1').innerHTML = `<span class="stool r"></span><span class="plate">${me.name}</span><span class="score" id="score-0">${me.score} pts</span>`;
    $('my-h2').innerHTML = coursesHTML(me);
    $('my-h3').innerHTML = `<span class="stat"><span class="backicon"></span>×<b>${humanCardCount(me)}</b></span>`;
    const fk = me.foods.length + '|' + (G.foodIncoming ? G.foodIncoming.dish : '');
    if (fk !== foodsKey) {
      foodsKey = fk;
      const mf = $('my-foods');
      mf.innerHTML = me.foods.map(f => foodThumb(f, 'sm')).join('') + (G.foodIncoming ? foodThumb(G.foodIncoming, 'sm', 'incoming') : '');
      mf.scrollTop = mf.scrollHeight;
    }

    renderFan(me);
  }

  function renderFan(me) {
    const fan = $('hand-fan'), ui = $('fan-ui');
    const live = G.phase === 'play' || G.phase === 'claim';
    fan.classList.toggle('live', live);
    const W = fan.clientWidth, H = fan.clientHeight;
    const hand = me.groups.filter(g => !g.table);
    const groups = G.dealing ? hand.slice(0, G.dealt[0]) : hand;
    const n = groups.length;
    const FW = W - 64;
    const sp = n > 1 ? clamp((FW - 96) / (n - 1), 44, 70) : 0;         // ui/table.md: tight overlapping fan (sửa (3): max 130 → 70)
    const total = 96 + sp * (n - 1);
    // sửa (4): centre on the table (alu-table), not on the fan's own flex box — #my-panel eats the left
    // side of the dock, so a self-centred fan reads as shifted right; re-anchored on every render, so a
    // play/draw that changes card count always re-centres on the table automatically.
    const tableR = rectOf($('alu-table')), fanR = rectOf(fan);
    const tableCenter = tableR.left + tableR.width / 2 - fanR.left;
    const x0 = clamp(tableCenter - total / 2, 0, Math.max(0, W - total)), mid = (n - 1) / 2;
    const rotStep = Math.min(3, 28 / Math.max(n, 1));
    const base = Math.max(2, H - 134 - 4);
    const dip = mid > 0 ? 12 / (mid * mid) : 0;
    let useful = new Set();
    if (G.phase === 'play') useful = new Set(formable(me.hand).flatMap(r => r.types));
    if (G.phase === 'claim' && G.claimOpts) useful = new Set(G.claimOpts.opts.flatMap(r => r.types).filter(t => t !== G.claimOpts.card));
    const newOn = G.newUid !== null && Date.now() - G.newAt < T.newRing;
    const keep = new Map();
    fan.querySelectorAll(':scope > .hgroup').forEach(e => keep.set(e.dataset.gid, e));
    let uiHtml = '';
    groups.forEach((g, i) => {
      const d = i - mid;
      const x = x0 + i * sp, yb = base + d * d * dip, r = d * rotStep;
      const cnt = g.food ? 1 : g.cards.length;
      const hStack = 134 + STACK_DY * (cnt - 1);
      const yTop = yb - STACK_DY * (cnt - 1);
      let el = keep.get(String(g.id));
      if (el) keep.delete(String(g.id));
      else { el = document.createElement('div'); el.dataset.gid = g.id; el.innerHTML = '<div class="wob"></div>'; fan.insertBefore(el, ui); }
      const hint = ['drop-ok', 'drop-bad'].filter(c => el.classList.contains(c));
      el.className = 'hgroup' + (cnt > 1 ? ' stack' : '') + (g.cooking ? ' locked' : '') + (hint.length ? ' ' + hint.join(' ') : '');
      el.style.cssText = `--x:${x}px;--y:${yTop}px;--r:${r}deg;height:${hStack}px;z-index:${i + 1}`;
      const wob = el.firstChild;
      wob.style.animationDelay = `-${(i * .37) % 2.6}s`;
      let inner = '';
      {
        g.cards.forEach((c, k) => {
          const cls = [];
          const top = k === cnt - 1;
          if (top) cls.push('top');
          if (g.cooking) cls.push('locked');
          if (c.claim) cls.push('claimable');
          else if (useful.has(c.t) && !g.cooking) cls.push('useful');
          const isNew = c.uid === G.newUid;
          if (isNew && newOn) cls.push('new');
          if ((isNew && G.drawHidden) || c.arriving || (drag && drag.ghost && drag.src.uid === c.uid)) cls.push('incoming');
          if (c.settle) { cls.push('settle'); c.settle = false; }
          inner += ingHTML(c.t, 'hand', cls.join(' '), `style="top:${k * STACK_DY}px" data-drag="hand" data-uid="${c.uid}" ${c.claim ? 'data-claim="1"' : ''}`);
        });
        if (g.cooking) inner = progHTML(g.cookStart) + inner;
      }
      wob.innerHTML = inner;
    });
    keep.forEach(e => e.remove());
    if (G.fanMsg) uiHtml += `<div class="fan-msg">${G.fanMsg}</div>`;
    ui.innerHTML = uiHtml;
    renderPrep(me, useful, newOn);
  }

  // table stacks (02 Rule 9–15, sửa (4)): each stack is its own small horizontal fan (not a vertical
  // pile), slotted around the table's horizontal centre — see ui/table.md Tuning pass (4)
  function renderPrep(me, useful, newOn) {
    const box = $('prep');
    const W = box.clientWidth, H = box.clientHeight;
    const groups = me.groups.filter(g => g.table);
    const n = groups.length;
    const keep = new Map();
    box.querySelectorAll(':scope > .hgroup').forEach(e => keep.set(e.dataset.gid, e));
    const cookable = groups.map(g => canCook(g));
    let uiHtml = '';
    groups.forEach((g, i) => {
      const cnt = g.food ? 1 : g.cards.length;
      const mid = (cnt - 1) / 2;
      const fanW = g.food ? PREP_W : PREP_W + FAN_DX * (cnt - 1);
      const x = W / 2 - fanW / 2, yTop = (H - FAN_H) / 2;           // sửa (5): the one stack sits centred in the cook zone
      let el = keep.get(String(g.id));
      if (el) keep.delete(String(g.id));
      else { el = document.createElement('div'); el.dataset.gid = g.id; el.innerHTML = '<div class="wob"></div>'; box.appendChild(el); }
      const hint = ['drop-ok', 'drop-bad'].filter(c => el.classList.contains(c));
      el.className = 'hgroup' + (cnt > 1 ? ' stack' : '') + (g.cooking ? ' locked' : '') + (hint.length ? ' ' + hint.join(' ') : '');
      el.style.cssText = `--x:${x}px;--y:${yTop}px;--r:0deg;width:${fanW}px;height:${FAN_H}px;z-index:${i + 1}`;
      const wob = el.firstChild;
      wob.style.animation = 'none';
      let inner = '';
      if (g.food) {
        const hid = drag && drag.ghost && drag.src.kind === 'food' && drag.src.gid === g.id;
        inner = foodHTML(g.food, 'prep', 'top useful' + (g.fresh ? ' pop-in shine' : '') + (hid ? ' incoming' : ''), `data-drag="food" data-gid="${g.id}" style="left:0;top:${(FAN_H - PREP_H) / 2}px"`);
        g.fresh = false;
      } else {
        const dip = mid > 0 ? FAN_DIP / (mid * mid) : 0;
        g.cards.forEach((c, k) => {
          const cls = [];
          if (k === cnt - 1) cls.push('top');
          if (g.cooking) cls.push('locked');
          if (c.claim) cls.push('claimable');
          else if (useful.has(c.t) && !g.cooking) cls.push('useful');
          if (c.arriving || (drag && drag.ghost && drag.src.uid === c.uid)) cls.push('incoming');
          if (c.settle) { cls.push('settle'); c.settle = false; }
          const d = k - mid, rot = d * FAN_ROT, y = (FAN_H - PREP_H) / 2 + d * d * dip;
          inner += ingHTML(c.t, 'prep', cls.join(' '), `style="left:${k * FAN_DX}px;top:${y}px;transform:rotate(${rot}deg)" data-drag="hand" data-uid="${c.uid}" ${c.claim ? 'data-claim="1"' : ''}`);
        });
        if (g.cooking) inner = progHTML(g.cookStart) + inner;
      }
      wob.innerHTML = inner;
      const cr = cookable[i];
      const maxW = 240;
      if (cr) uiHtml += `<button class="primary cookbtn" data-act="cook" data-gid="${g.id}" title="Cook ${cr.dish} +${cr.pts}" style="left:${x + fanW / 2}px;top:${yTop + FAN_H - 22}px;transform:translateX(-50%);max-width:${maxW}px">Cook ${cr.dish} +${cr.pts}</button>`;
    });
    keep.forEach(e => e.remove());
    box.querySelectorAll(':scope > .cookbtn, :scope > .prep-tip').forEach(e => e.remove());
    if (!n && !tipDone && Date.now() < tipUntil && G.phase === 'play') uiHtml += `<div class="prep-tip">Stack here to cook</div>`;
    box.insertAdjacentHTML('beforeend', uiHtml);
  }

  function renderRecipes() {
    const me = G ? G.players[0] : null;
    const rows = ['A', 'M', 'D'].map(c => RECIPES.filter(r => r.c === c).map(r => {
      const can = me && r.types.every(t => me.hand.includes(t));
      return `<tr class="${can ? 'can' : ''}"><td><span class="sw cc-${c}"></span><b>${c}</b> ${COURSE_NAME[c]}</td><td>${foodThumb(r, 'th')} <b>${r.dish}</b></td><td>+${r.pts}</td><td>${r.types.map(label).join(' + ')}</td></tr>`;
    }).join('')).join('');
    $('recipeBox').innerHTML = `<h2>Recipes <span style="font-size:12px;color:var(--gold)">(gold = in your hand now)</span></h2>
      <table class="recipes"><tr><th>Course</th><th>Food</th><th>Pts</th><th>Ingredients</th></tr>${rows}</table>
      <div style="margin-top:8px;font-size:12px;color:var(--text-dim)">${COPIES_PER_TYPE} copies of each ingredient. First to own all 3 courses: +${FIRST_FULL_BONUS}, game ends.</div>
      <div class="row"><button id="btnCloseRec">Close</button></div>`;
    $('btnCloseRec').addEventListener('pointerup', () => $('recipeModal').classList.remove('show'));
  }

  // =========================== ANIMATION ===========================
  const sized = (r, w, h) => ({ left: r.left + (r.width - w) / 2, top: r.top + (r.height - h) / 2, width: w, height: h });

  // curved card flight (quadratic arc), token-guarded; target coords fixed at start (ui/table.md resize rule)
  function fly(html, from, to, ms, opt = {}) {
    const el = elFrom(html);
    el.style.cssText += `;position:fixed;left:${from.left}px;top:${from.top}px;width:${from.width}px;height:${from.height}px;margin:0;transform-origin:0 0;`;
    $('fx').appendChild(el);
    const dx = to.left - from.left, dy = to.top - from.top, sx = to.width / from.width, sy = to.height / from.height;
    const arc = opt.arc ?? Math.min(140, Math.hypot(dx, dy) * .25 + 20);
    const cx = dx / 2, cy = dy / 2 - arc;
    const frames = [];
    for (let i = 0; i <= 14; i++) {
      const t = i / 14, u = 1 - t;
      const x = 2 * u * t * cx + t * t * dx, y = 2 * u * t * cy + t * t * dy;
      const rot = (opt.spin || 0) * Math.sin(Math.PI * t);
      frames.push({ transform: `translate(${x}px,${y}px) rotate(${rot}deg) scale(${1 + (sx - 1) * t},${1 + (sy - 1) * t})` });
    }
    el.animate(frames, { duration: ms, easing: opt.easing || 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' });
    return wait(ms).finally(() => el.remove());
  }

  function backsTarget(p) {
    if (p.idx === 0) return sized(rectOf($('hand-fan')), 40, 56);
    const bk = seatEl(p.idx).querySelector('.seat-hand-backs');
    const r = rectOf(bk);
    return { left: r.left + Math.min(+bk.dataset.next || 0, r.width - 40), top: r.top + 1, width: 40, height: 56 };
  }

  async function dealAnim(tok) {
    const n = G.players.length;
    G.dealing = true; G.dealt = G.players.map(() => 0); G.dealSkip = false; render();
    await wait(200);
    const poolR = rectOf($('pool-pile'));
    for (let k = 0; k < HAND_START && !G.dealSkip; k++) for (let j = 0; j < n && !G.dealSkip; j++) {
      const i = (G.current + j) % n, p = G.players[i];
      const to = p.human ? sized(rectOf($('hand-fan')), 96, 134) : backsTarget(p);
      fly(backHTML(p.human ? 'center' : 'mini'), p.human ? poolR : sized(poolR, 40, 56), to, T.deal, { arc: 30, spin: p.human ? 0 : 8 })
        .then(() => { if (G.dealing) { G.dealt[i]++; softRender(); } }).catch(noop);
      await wait(T.dealStagger);
    }
    if (G.dealSkip) $('fx').innerHTML = '';
    else await wait(T.deal + 60);
    checkToken(tok);
    G.dealing = false; G.dealt = null; render();
  }

  async function animDrawHuman(card) {
    const el = $('hand-fan').querySelector(`.card[data-uid="${G.newUid}"]`);
    const to = el ? rectOf(el) : sized(rectOf($('hand-fan')), 96, 134);
    await fly(ingHTML(card, 'center', 'shine'), rectOf($('pool-pile')), to, T.draw);
  }
  async function animDrawBot(p) {
    await fly(backHTML('center'), rectOf($('pool-pile')), backsTarget(p), T.draw);
  }
  async function animPlay(p, card) {
    const to = rectOf($('last-slot'));
    const from = p.human ? (G.playFrom || sized(rectOf($('hand-fan')), 96, 134)) : backsTarget(p);
    G.playFrom = null;
    await fly(ingHTML(card, p.human ? 'hand' : 'mini'), from, to, T.play);
  }
  async function animDiscard(card) {
    G.lastHidden = true; render();
    await fly(ingHTML(card, 'center'), rectOf($('last-slot')), rectOf($('discard-slot')), T.discard, { arc: 20 });
  }
  async function animClaimToSeat(q, card, fromRect) {
    G.lastHidden = true; render();
    const from = fromRect || rectOf($('last-slot'));
    await fly(ingHTML(card, 'center'), from, backsTarget(q), 300);
  }

  // 02 Rule 15: bots show mini stack → progress → food card at .seat-stack → into .seat-foods
  async function botCook(p, r, why, viaClaim) {
    const b = p.stk;
    const s = seatEl(p.idx);
    const fromR = backsTarget(p);
    b.stack = r.types.map(t => ({ t })); b.arriving = b.stack.length; render();
    for (let i = 0; i < b.stack.length; i++) {
      const cards = s.querySelectorAll('.seat-stack .stack .card');
      await fly(ingHTML(b.stack[i].t, 'bstk'), fromR, rectOf(cards[i]), T.stackFly, { arc: 16 });
      b.arriving--; render();
    }
    await wait(200);
    b.cooking = true; b.cookStart = Date.now(); render();
    await wait(COOK_MS);
    b.cooking = false; b.stack = []; b.food = r; render();
    smokeAt(rectOf(s.querySelector('.seat-stack')));
    await wait(450);
    const fromF = rectOf(s.querySelector('.seat-stack .card'));
    b.food = null; b.collecting = r; render();
    const fr = rectOf(s.querySelector('.seat-foods'));
    const fs = 44;
    const to = { left: fr.left + Math.min(p.foods.length * (fs + 4), fr.width - fs), top: fr.top + (fr.height - fs) / 2, width: fs, height: fs };
    await fly(foodHTML(r, 'bstk'), fromF, { left: to.left, top: to.top, width: 48, height: 67 }, 400);
    b.collecting = null;
    revealFood(p, r, why, viaClaim);
    scorePop(to, 'score-' + p.idx, r);
  }

  // sửa (4): "đóng quạt lại rồi biến thành food card" — the fan of ingredient cards collapses shut in
  // place (scaleX toward its own centre), then the group swaps to the food card (existing pop-in+shine)
  async function finishCook(me, g) {
    const el = document.querySelector(`#prep .hgroup[data-gid="${g.id}"]`);
    if (el) {
      const anim = el.animate([
        { transform: 'scaleX(1)' },
        { transform: 'scaleX(.1)', offset: .8 },
        { transform: 'scaleX(.1) scaleY(.92)' }
      ], { duration: T.fanClose, easing: 'ease-in', fill: 'forwards' });
      const tok = gameToken;
      await anim.finished.catch(noop);
      anim.cancel();                                                // fill:forwards would otherwise leave the squash on the food card that replaces it
      checkToken(tok);
    }
    g.cooking = false; g.food = g.cookR; g.cards = []; g.fresh = true;
    render();
    if (el) smokeAt(rectOf(el));
  }

  // 02 Rule 12: food card → #my-foods = the official reveal
  async function collectAnim(me, g, viaClaim) {
    const r = g.food;
    const el = document.querySelector(`#prep .hgroup[data-gid="${g.id}"] .card`);
    const fromRect = el ? rectOf(el) : sized(rectOf($('prep')), PREP_W, PREP_H);
    await collectFly(me, g, r, fromRect, viaClaim);
  }
  async function collectFly(me, g, r, fromRect, viaClaim) {
    const i = me.groups.indexOf(g); if (i >= 0) me.groups.splice(i, 1);
    G.foodIncoming = r; G.selected = null; render();
    const ph = $('my-foods').querySelector('.fcard.incoming');
    const to = ph ? rectOf(ph) : sized(rectOf($('my-foods')), 64, 64);
    await fly(foodHTML(r, 'hand'), fromRect, { left: to.left, top: to.top, width: 64 * 96 / 134, height: 64 }, T.collect);
    G.foodIncoming = null;
    if (!viaClaim) G.phase = 'play';
    revealFood(me, r, '', viaClaim);
    scorePop(to, 'score-0', r);
  }

  function collectFood(g, fromRect) {
    const me = G.players[0];
    if (G.phase !== 'play' || !g || !g.food) return;
    G.phase = 'collecting';
    const tok = gameToken;
    collectFly(me, g, g.food, fromRect, false).then(async () => {
      if (tok !== gameToken || G.ended) return;
      render();
      if (me.hand.length === 0) { G.phase = 'wait'; await humanEmptyHand(); resolveHuman(null); }
    }).catch(e => { if (!(e instanceof Abort)) console.error(e); });
  }

  function scorePop(fromRect, scoreId, r) {
    const el = document.createElement('div'); el.className = 'pop';
    el.innerHTML = `+${r.pts}<small>${r.c}</small>`;
    const x = fromRect.left + fromRect.width / 2, y = fromRect.top + fromRect.height / 2;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    document.body.appendChild(el);
    const t = $(scoreId), tr = t ? rectOf(t) : null;
    const dx = tr ? tr.left + tr.width / 2 - x : 0, dy = tr ? tr.top + tr.height / 2 - y : -30;
    el.animate([
      { transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 },
      { transform: 'translate(-50%,-50%) scale(1.2)', opacity: 1, offset: .2 },
      { transform: 'translate(-50%,-50%) scale(1)', opacity: 1, offset: .3 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.8)`, opacity: .85 }
    ], { duration: 650, easing: 'ease-in', fill: 'forwards' });
    setTimeout(() => {
      el.remove();
      const s = $(scoreId); if (s) { s.classList.remove('punch'); void s.offsetWidth; s.classList.add('punch'); }
    }, 650);
  }

  function smokeAt(r) {
    for (let i = 0; i < 4; i++) {
      const s = document.createElement('div'); s.className = 'smoke';
      s.style.left = (r.left + r.width * (.25 + i * .17) - 9) + 'px'; s.style.top = (r.top + 10) + 'px';
      document.body.appendChild(s);
      s.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${(Math.random() - .5) * 16}px,-24px) scale(1.3)`, opacity: 0 }],
        { duration: 450, easing: 'ease-out', fill: 'forwards' });
      setTimeout(() => s.remove(), 460);
    }
  }

  let toastTimer = 0;
  function toast(msg, ms = T.toast) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
  }

  async function humanEmptyHand() {
    G.fanMsg = 'No cards to play — waiting…'; render();
    await wait(1000);
    G.fanMsg = '';
  }

  // =========================== HUMAN INPUT ===========================
  let drag = null;
  const app = $('app');
  const ME = () => G.players[0];

  function playCard(uid, fromRect) {                               // 03 Rule 1
    if (G.phase !== 'play') return false;
    const me = ME();
    if (me.groups.some(g => g.cooking)) { toast('Wait for the cook to finish', 1200); return false; }
    if (me.groups.some(g => g.food)) { toast('Collect your food first', 1200); return false; }
    const f = findCard(me, uid); if (!f || f.c.claim || f.k !== f.g.cards.length - 1) return false;
    f.g.cards.splice(f.k, 1); dropEmptyGroups(me);
    G.selected = null; G.phase = 'wait'; G.playFrom = fromRect;
    resolveHuman(f.c.t);
    return true;
  }

  function cookPress(gid) {
    const g = groupById(gid), r = canCook(g); if (!r) return;
    const me = ME();
    g.cooking = true; g.cookStart = Date.now(); g.cookR = r;
    if (G.phase === 'claim') { G.phase = 'claimCook'; render(); resolveHuman({ r, g }); return; }   // 03 Rule 12
    render();
    const tok = gameToken;
    wait(COOK_MS).then(() => { if (tok === gameToken && me.groups.includes(g) && g.cooking) return finishCook(me, g); }).catch(noop);
  }

  function doAct(el) {
    if (!G || G.ended) return;
    const a = el.dataset.act, me = ME();
    if (a === 'pool' && G.phase === 'draw') { G.phase = 'wait'; render(); resolveHuman(true); }
    else if (a === 'pass' && G.phase === 'claim') { stripClaim(me); resolveHuman(null); }
    else if (a === 'cook') cookPress(+el.dataset.gid);
  }

  function onTap(src) {
    if (src.kind === 'hand' && src.table) {                          // tap a table card → back to hand
      if (!src.claim) toHand(ME(), src.uid);
    }
    else if (src.kind === 'hand') {
      if (G.phase === 'play' && !src.claim) {                       // sửa (5): no select/Play button — point at the play zone instead
        const ls = $('last-slot'); ls.classList.remove('play-flash'); void ls.offsetWidth; ls.classList.add('play-flash');
        setTimeout(() => ls.classList.remove('play-flash'), 460);
      }
    }
    else if (src.kind === 'claim') toast('Drag it onto a stack on the table to claim', 1500);
    else if (src.kind === 'food') collectFood(groupById(src.gid), rectOf(src.el));
  }

  function inRect(el, x, y, pad = 0) {
    if (!el) return false;
    const r = el.getBoundingClientRect();
    return x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad;
  }
  function hitAt(x, y) {
    for (const el of document.elementsFromPoint(x, y)) {
      const g = el.closest('.hgroup');
      if (g) return { kind: 'group', gid: +g.dataset.gid, el: g };
      if (el.closest('#my-panel')) return { kind: 'panel' };
      if (el.closest('#center-play')) return { kind: 'center' };
    }
    if (inRect($('center-play'), x, y, 30)) return { kind: 'center' };
    if (inRect($('my-panel'), x, y, 6)) return { kind: 'panel' };
    if (inRect($('prep'), x, y, 16)) return { kind: 'table' };       // sửa (5): only the small centred cook zone
    if (inRect($('hand-fan'), x, y, 20)) return { kind: 'fan' };
    return null;
  }
  function clearHints() {
    document.querySelectorAll('.hgroup.drop-ok, .hgroup.drop-bad').forEach(e => e.classList.remove('drop-ok', 'drop-bad'));
    $('my-panel').classList.remove('hot'); $('prep').classList.remove('hot', 'show'); $('last-slot').classList.remove('play-hot');
  }
  function flashBad(el) {
    if (!el) return;
    el.classList.remove('bad-flash'); void el.offsetWidth; el.classList.add('bad-flash');
    setTimeout(() => el.classList.remove('bad-flash'), 220);
  }
  function consume(d) { const gr = rectOf(d.ghost); d.ghost.remove(); drag = null; return gr; }
  // take the dragged ingredient card out of wherever it lives (group or center)
  function takeCard(me, s) {
    if (s.kind === 'claim') return { uid: ++UID, t: s.t, claim: true };
    const f = findCard(me, s.uid); if (!f) return null;
    f.g.cards.splice(f.k, 1); dropEmptyGroups(me);
    if (G.selected === s.uid) G.selected = null;
    return f.c;
  }
  // returns 'ok' | 'quiet' (cancel, snap back silently) | 'bad' (snap back + shake)
  function onDrop(d, x, y) {
    const s = d.src, me = ME();
    const h = hitAt(x, y);
    if (s.kind === 'food') {
      if (h && h.kind === 'panel') { const gr = consume(d); collectFood(groupById(s.gid), gr); return 'ok'; }
      return 'quiet';                                              // art.md: cancel, not an error
    }
    const fromGroup = s.kind === 'hand';
    const place = (tg, gr) => {                                    // move the dragged card into a table stack (new or existing)
      const c = takeCard(me, s); if (!c) { render(); return; }
      c.arriving = true;
      if (tg) tg.cards.push(c); else me.groups.push(newGroup([c], true));
      tipDone = true;
      render();
      const ce = $('prep').querySelector(`.card[data-uid="${c.uid}"]`);
      const tok = gameToken;
      if (ce) fly(ingHTML(c.t, 'prep'), gr, rectOf(ce), T.stackFly, { arc: 10, easing: 'ease-out' })
        .then(() => { if (tok !== gameToken) return; c.arriving = false; c.settle = true; render(); }).catch(noop);
      else { c.arriving = false; render(); }
    };
    if (h && h.kind === 'group') {                                 // onto a table stack
      if (fromGroup && h.gid === s.gid) return 'quiet';
      const tg = groupById(h.gid);
      if (!tg.table) {                                             // onto a hand card: table card → back to hand, hand card → nothing
        if (s.table && !s.claim) { consume(d); toHand(me, s.uid); return 'ok'; }
        if (s.claim && s.table) { consume(d); takeCard(me, s); render(); return 'ok'; }
        return s.claim ? 'bad' : 'quiet';
      }
      const err = mergeReject(tg, s.t);
      if (err) { flashBad(h.el); toast(err, 1200); return 'bad'; }
      place(tg, consume(d));
      return 'ok';
    }
    if (h && h.kind === 'table') {                                 // cook zone: start the one stack, or add to it (sửa (5): one stack at a time)
      const tg = me.groups.find(g => g.table);
      if (!tg) { place(null, consume(d)); return 'ok'; }
      if (s.table) return 'quiet';
      const err = mergeReject(tg, s.t);
      if (err) { const ge = $('prep').querySelector(`.hgroup[data-gid="${tg.id}"]`); flashBad(ge); toast(err, 1200); return 'bad'; }
      place(tg, consume(d));
      return 'ok';
    }
    if (s.claim) {                                                 // 03 Rule 15: claim card out of a stack → back to center
      if (!fromGroup) return h && h.kind === 'center' ? 'quiet' : 'bad';
      consume(d); takeCard(me, s); render(); return 'ok';
    }
    if (h && h.kind === 'center') {
      if (!s.top) return 'bad';
      if (G.phase !== 'play') { toast('Not your turn — claim or Pass', 1200); return 'bad'; }
      const gr = rectOf(d.ghost);
      if (!playCard(s.uid, gr)) return 'bad';
      consume(d); render(); return 'ok';
    }
    if (h && h.kind === 'fan') {
      if (!s.table) return 'quiet';
      consume(d); toHand(me, s.uid); return 'ok';
    }
    return 'bad';
  }
  function toHand(me, uid) {                                       // 02 Rule 13: card leaves its table stack, back into the hand (sorted)
    const f = findCard(me, uid); if (!f || !f.g.table || f.g.cooking || f.c.claim) { render(); return; }
    f.g.cards.splice(f.k, 1); dropEmptyGroups(me);
    insertLoose(me, f.c);
    render();
  }

  function snapBack(d, bad) {
    const g = d.ghost; d.snapping = true;
    const gr = rectOf(g);
    g.style.transform = ''; g.style.opacity = '';
    if (bad) g.classList.add('invalid');
    g.animate([{ left: gr.left + 'px', top: gr.top + 'px' }, { left: d.rect.left + 'px', top: d.rect.top + 'px' }], { duration: 200, easing: 'ease-out', fill: 'forwards' });
    setTimeout(() => { g.remove(); if (drag === d) { drag = null; render(); } }, 210);
  }

  function tiltLoop() {
    if (!drag || !drag.ghost || drag.snapping) return;
    drag.vx *= .85;
    const target = clamp(drag.vx * .05, -12, 12);
    drag.tilt += (target - drag.tilt) * .25;
    drag.ghost.style.transform = `rotate(${drag.tilt}deg) scale(1.05)`;
    requestAnimationFrame(tiltLoop);
  }

  app.addEventListener('pointerdown', e => {
    if (!G) return;
    if (G.dealing) { G.dealSkip = true; return; }
    if (e.target.closest('[data-act]') || drag) return;
    const d = e.target.closest('[data-drag]'); if (!d) return;
    const kind = d.dataset.drag, me = ME();
    const src = { kind, el: d };
    if (kind === 'hand') {
      if (!['play', 'claim'].includes(G.phase)) return;
      const f = findCard(me, +d.dataset.uid); if (!f || f.g.cooking) return;
      if (f.c.claim && G.phase !== 'claim') return;
      Object.assign(src, { uid: f.c.uid, gid: f.g.id, t: f.c.t, claim: f.c.claim, table: f.g.table, top: f.k === f.g.cards.length - 1, solo: f.g.cards.length === 1 });
    } else if (kind === 'claim') {
      if (G.phase !== 'claim' || claimInGroup(me)) return;
      Object.assign(src, { t: G.lastPlayed, claim: true, gid: null });
    } else if (kind === 'food') {
      if (G.phase !== 'play') return;
      const g = groupById(+d.dataset.gid); if (!g || !g.food) return;
      src.gid = g.id;
    } else return;
    e.preventDefault();
    try { app.setPointerCapture(e.pointerId); } catch (_) {}
    drag = { src, id: e.pointerId, x0: e.clientX, y0: e.clientY, lx: e.clientX, lt: performance.now(), vx: 0, tilt: 0, ghost: null, rect: rectOf(d), tok: gameToken };
  });

  app.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id || drag.snapping) return;
    const s = drag.src;
    if (!drag.ghost) {
      if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
      const html = s.kind === 'food' ? foodHTML(groupById(s.gid).food, 'prep') : ingHTML(s.t, s.kind === 'claim' ? 'center' : s.table ? 'prep' : 'hand');
      drag.ghost = elFrom(html);
      $('drag-layer').appendChild(drag.ghost);
      if (s.kind === 'hand') G.selected = null;
      render();
      requestAnimationFrame(tiltLoop);
    }
    const now = performance.now(), dt = Math.max(1, now - drag.lt);
    drag.vx = drag.vx * .5 + ((e.clientX - drag.lx) / dt * 1000) * .5;
    drag.lx = e.clientX; drag.lt = now;
    const g = drag.ghost;
    g.style.left = (e.clientX - g.offsetWidth / 2 - 20) + 'px';
    g.style.top = (e.clientY - g.offsetHeight / 2 - 40) + 'px';
    clearHints();
    const h = hitAt(e.clientX, e.clientY);
    g.style.opacity = '';
    if (s.kind === 'food') { if (h && h.kind === 'panel') $('my-panel').classList.add('hot'); }
    else if (h && h.kind === 'group' && h.gid !== s.gid && groupById(h.gid).table) {   // art.md valid/invalid drop hint
      const bad = mergeReject(groupById(h.gid), s.t);
      h.el.classList.add(bad ? 'drop-bad' : 'drop-ok');
      if (bad) g.style.opacity = '.6';
    }
    else if (h && h.kind === 'table' && !s.table) {
      const tg = ME().groups.find(q => q.table), bad = tg && mergeReject(tg, s.t);
      $('prep').classList.add('hot');
      if (bad) { g.style.opacity = '.6'; const ge = $('prep').querySelector(`.hgroup[data-gid="${tg.id}"]`); if (ge) ge.classList.add('drop-bad'); }
    }
    if (s.kind !== 'food') {                                        // sửa (5): show where cards can go while dragging
      $('prep').classList.add('show');
      if (G.phase === 'play' && !s.claim && s.top && h && h.kind === 'center') $('last-slot').classList.add('play-hot');
    }
  });

  function endDrag(e, cancelled) {
    const d = drag;
    try { app.releasePointerCapture(d.id); } catch (_) {}
    clearHints();
    if (d.snapping) return;
    if (d.tok !== gameToken || !G) { drag = null; $('drag-layer').innerHTML = ''; return; }
    if (!d.ghost) { drag = null; if (!cancelled) onTap(d.src); return; }
    const res = cancelled ? 'bad' : onDrop(d, e.clientX, e.clientY);
    if (res !== 'ok' && drag === d) snapBack(d, res === 'bad');
  }

  app.addEventListener('pointerup', e => {
    if (drag && e.pointerId === drag.id) { endDrag(e, false); return; }
    const act = e.target.closest('[data-act]');
    if (act) doAct(act);
  });
  app.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.id) endDrag(e, true); });
  app.addEventListener('lostpointercapture', e => { if (drag && e.pointerId === drag.id && !drag.snapping && drag.ghost && drag.ghost.isConnected) endDrag(e, true); });

  // =========================== HUD ===========================
  $('btnRestart').addEventListener('pointerup', newGame);
  $('numPlayers').addEventListener('change', newGame);
  $('btnRecipes').addEventListener('pointerup', () => { renderRecipes(); $('recipeModal').classList.add('show'); });
  $('btnLog').addEventListener('pointerup', () => $('log-drawer').classList.toggle('open'));
  $('btnLogClose').addEventListener('pointerup', () => $('log-drawer').classList.remove('open'));
  let resizeT = 0;
  window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(render, 60); });

  const qp = new URLSearchParams(location.search).get('players');   // optional ?players=2|3|4
  if (['2', '3', '4'].includes(qp)) $('numPlayers').value = qp;
  newGame();
})();
</script>
</body>
</html>
