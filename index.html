<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack Kitchen</title>
</head>
<body>
<!-- ============ RESTAURANT (main screen — design/ui/restaurant.md) ============ -->
<div id="restaurant" class="screen" hidden>
  <div id="rest-hud">
    <input id="rest-name" maxlength="12" autocomplete="off" spellcheck="false" placeholder="Tap to name your chef">
    <div class="rh-lvl"><span id="rest-level">Level 1</span><span class="xpbar"><i id="rest-xp"></i></span><span id="rest-xptext"></span></div>
    <div class="rh-gold"><span class="coin"></span><b id="rest-gold">0</b></div>
    <div class="rh-away" id="rest-away" hidden></div>
    <div class="rh-hint" id="rest-hint" hidden></div>
    <div class="rh-warn" id="rest-warn" hidden></div>
  </div>

  <div id="rest-stage"><div id="rest-grid"><div id="rest-drop" hidden></div></div></div>

  <div id="rest-nav">
    <button class="card nav-card" id="navBots" data-pop="pop-bots"><span class="hdr"><span>Play vs Bots</span></span><span class="ph"><span class="phl">VS</span></span></button>
    <button class="card nav-card" id="navOnline" data-pop="pop-online"><span class="hdr"><span>Online Room</span></span><span class="ph"><span class="phl">ON</span></span></button>
    <button class="card nav-card" id="navShop"><span class="hdr"><span>Shop</span></span><span class="ph"><span class="phl">SH</span></span></button>
    <button class="card nav-card" id="navMenu"><span class="hdr"><span>Menu</span></span><span class="ph"><span class="phl">ME</span></span></button>
  </div>

  <div id="rest-pop" hidden>
    <div class="pop-body" id="pop-bots" hidden>
      <div class="seg" id="botCount">
        <button data-n="2">2 players</button><button data-n="3">3 players</button><button data-n="4" class="on">4 players</button>
      </div>
      <button class="primary big" id="btnBots">Play</button>
    </div>
    <div class="pop-body" id="pop-online" hidden>
      <button class="primary big" id="btnCreate">Create room</button>
      <div class="join-row">
        <input id="roomCode" maxlength="5" autocomplete="off" spellcheck="false" placeholder="CODE">
        <button class="big" id="btnJoin">Join</button>
      </div>
    </div>
  </div>

  <div class="home-msg" id="rest-msg"></div>
</div>

<!-- ============ LOBBY ============ -->
<div id="lobby" class="screen" hidden>
  <div class="home-box">
    <h1 class="logo small">Room <span id="lobbyCode">·····</span></h1>
    <div class="share">
      <input id="shareLink" readonly>
      <button id="btnCopy">Copy link</button>
    </div>
    <div class="seg" id="seatCount" hidden>
      <button data-n="2">2 seats</button><button data-n="3">3 seats</button><button data-n="4" class="on">4 seats</button>
    </div>
    <ul class="seat-list" id="seatList"></ul>
    <div class="home-msg" id="lobbyMsg"></div>
    <div class="row">
      <button id="btnLeaveLobby">Leave</button>
      <button class="primary big" id="btnStart" hidden>Start</button>
    </div>
  </div>
</div>

<!-- ============ TABLE ============ -->
<div id="app" hidden>
  <div id="hud">
    <span class="title">Stack Kitchen</span>
    <span class="chip">Turn <b id="cTurn">0</b></span>
    <span class="chip" id="cRoom" hidden></span>
    <span class="chip timer" id="cTimer" hidden></span>
    <span class="spacer"></span>
    <button id="btnHome">Home</button>
  </div>
  <div id="menu-rail"></div>

  <div id="table-surface">
    <div id="alu-table"></div>
    <svg id="props" viewBox="0 0 120 64" width="150" height="80" fill="none" stroke="#cfd3d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="34" cy="46" rx="20" ry="10" fill="#d9dcdf"/><path d="M14 42 Q34 20 54 42" fill="#eceff1"/>
      <path d="M50 32 Q66 30 64 42 Q62 50 50 46"/><path d="M18 30 Q10 30 10 38 Q10 46 18 44"/>
      <rect x="30" y="14" width="10" height="6" rx="2" fill="#eceff1"/>
      <path d="M84 30 L90 54 L106 54 L112 30 Z" fill="rgba(120,80,40,.55)"/>
      <circle cx="93" cy="36" r="3" fill="#e8f4ff"/><circle cx="101" cy="40" r="3" fill="#e8f4ff"/>
    </svg>
    <div id="seats"></div>
    <div id="center-play">
      <div class="slot" id="pool-pile"></div>
      <div class="slot" id="last-slot"></div>
      <div class="slot" id="discard-slot"></div>
    </div>
    <div id="prep"></div>
    <div id="my-foods"></div>
    <div id="dock">
      <div class="hand-fan" id="hand-fan"><div class="fan-ui" id="fan-ui"></div></div>
      <div id="my-panel">
        <div class="head1 prow" id="my-h1"></div>
        <div id="my-order"></div>
      </div>
    </div>
  </div>

  <div id="fx"></div>
  <div id="drag-layer"></div>
</div>

<div id="toast"></div>
<div id="recipe-pop" hidden></div>
<div class="modal intro" id="menuIntroModal"><div class="box" id="menuIntroBox"></div></div>
<div class="modal intro" id="orderIntroModal"><div class="box" id="orderIntroBox"></div></div>
<!-- 11-match-finale.md: spotlight the finisher → confetti + CONGRATULATIONS → #endModal -->
<div id="finale" hidden><div id="fin-spot"></div><div id="fin-order" hidden></div><div id="fin-text"></div></div>
<div class="modal" id="shopModal"><div class="box" id="shopBox"></div></div>
<div class="modal" id="menuModal"><div class="box" id="menuBox"></div></div>
<div class="modal" id="endModal"><div class="box" id="endBox"></div></div>
<div class="modal" id="noticeModal"><div class="box" id="noticeBox"></div></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
